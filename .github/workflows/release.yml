# Builds, validates and packages Fenix for Linux, Windows and macOS.
# Run it from the Actions tab ("Run workflow") or by pushing a v* tag; each platform's zip is
# attached to the run as an artifact. On a tag, it also publishes a GitHub Release with the three
# zips and the matching CHANGELOG section as release notes.
#
# macOS signing and notarisation turn on when these repository secrets exist:
#   MACOS_CERTIFICATE           base64 of the Developer ID Application .p12
#   MACOS_CERTIFICATE_PASSWORD  password of that .p12
#   MACOS_SIGNING_IDENTITY      e.g. "Developer ID Application: Name (TEAMID)"
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD   for notarytool
# Without them the macOS build is ad-hoc signed and its README explains how to unblock it.

name: Release builds

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  JUCE_VERSION: "8.0.13"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-22.04, platform: linux, pluginval: pluginval_Linux.zip }
          - { name: Windows, os: windows-2022, platform: windows, pluginval: pluginval_Windows.zip }
          - { name: macOS, os: macos-14, platform: macos, pluginval: pluginval_macOS.zip }
    env:
      SIGN_MACOS: ${{ secrets.MACOS_CERTIFICATE != '' }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch JUCE
        run: |
          juce="$RUNNER_TEMP/JUCE"
          [[ "${{ matrix.platform }}" == windows ]] && juce="$(cygpath -m "$juce")"
          git clone --depth 1 --branch "$JUCE_VERSION" https://github.com/juce-framework/JUCE.git "$juce"
          echo "JUCE_DIR=$juce" >> "$GITHUB_ENV"

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-12 libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libxcomposite-dev xvfb

      - name: Configure
        run: |
          args=(-DCMAKE_BUILD_TYPE=Release -DJUCE_DIR="$JUCE_DIR" -DFENIX_COPY_AFTER_BUILD=OFF -DFENIX_LTO=OFF)
          case "${{ matrix.platform }}" in
            linux) export CC=gcc-12 CXX=g++-12 ;;
            macos) args+=(-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15) ;;
          esac
          cmake -B build "${args[@]}"

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Sign (macOS, Developer ID)
        if: matrix.platform == 'macos' && env.SIGN_MACOS == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          keychain_password="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$keychain_password" build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" build.keychain
          for bundle in build/*_artefacts/Release/VST3/*.vst3 build/*_artefacts/Release/AU/*.component; do
            codesign --force --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$bundle"
          done

      - name: Sign (macOS, ad-hoc)
        if: matrix.platform == 'macos' && env.SIGN_MACOS != 'true'
        run: |
          for bundle in build/*_artefacts/Release/VST3/*.vst3 build/*_artefacts/Release/AU/*.component; do
            codesign --force --deep --sign - "$bundle"
          done

      - name: Validate VST3 with pluginval
        run: |
          curl -sSL -o "$RUNNER_TEMP/pluginval.zip" "https://github.com/Tracktion/pluginval/releases/latest/download/${{ matrix.pluginval }}"
          unzip -q "$RUNNER_TEMP/pluginval.zip" -d "$RUNNER_TEMP/pluginval"
          runner=()
          case "${{ matrix.platform }}" in
            linux) pluginval="$RUNNER_TEMP/pluginval/pluginval"; runner=(xvfb-run -a) ;;
            windows) pluginval="$RUNNER_TEMP/pluginval/pluginval.exe" ;;
            macos) pluginval="$RUNNER_TEMP/pluginval/pluginval.app/Contents/MacOS/pluginval" ;;
          esac
          for bundle in build/*_artefacts/Release/VST3/*.vst3; do
            echo "::group::$bundle"
            "${runner[@]}" "$pluginval" --strictness-level 10 --skip-gui-tests --validate "$bundle"
            echo "::endgroup::"
          done

      - name: Validate AU with auval
        if: matrix.platform == 'macos'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/*_artefacts/Release/AU/*.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          for code in FxBs FxDr FxSh FxHc FxWd FxIr; do
            auval -v aufx "$code" Fnrk
          done

      - name: Package
        run: python tools/package.py ${{ matrix.platform }} build ${{ matrix.platform == 'macos' && env.SIGN_MACOS == 'true' && '--signed' || '' }}

      - name: Notarise (macOS)
        if: matrix.platform == 'macos' && env.SIGN_MACOS == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit dist/Fenix-*-macOS.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait

      - uses: actions/upload-artifact@v4
        with:
          name: Fenix-${{ matrix.name }}
          path: dist/*.zip
          retention-days: 3

  # On a version tag (e.g. v1.0.0) publish a GitHub Release with the three zips.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download the zips
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release notes from the CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "## Downloads"
            echo
            echo "| System | File |"
            echo "|---|---|"
            echo "| Windows 10/11 (64-bit) | \`Fenix-$version-Windows-x64.zip\`: VST3 |"
            echo "| macOS 10.15+ (Apple Silicon and Intel) | \`Fenix-$version-macOS.zip\`: VST3 + AU |"
            echo "| Linux x86_64 (glibc 2.35+) | \`Fenix-$version-Linux-x64.zip\`: VST3 + LV2 |"
            echo
            echo "Install steps are in the README inside each zip. You do not need the \"Source code\" archives."
            echo
            echo "## Changes"
            awk -v v="$version" '$0 == v {found=1; next} found && /^[0-9]+\.[0-9]+/ {exit} found' packaging/CHANGELOG.txt
          } > notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Fenix ${{ github.ref_name }}
          files: dist/*.zip
          body_path: notes.md
